# M7 豆包双工语音（A 方案）：语音模型只负责听、说、判停、打断和闲聊，车控仍交给规划器。
# 密钥只放 .env：VOLC_S2S_API_KEY；VOLC_S2S_MODEL 可覆盖下面的 model。

url: wss://openspeech.bytedance.com/api/v3/realtime/dialogue
resource_id: volc.speech.dialog
app_key: PlgvMymc7f3tQnJ6        # 文档规定的固定值，不是密钥
model: "1.2.1.1"                 # O2.0；SC2.0 是 2.2.0.0
bot_name: 小安
speaker: ""                      # 留空用默认音色
end_smooth_window_ms: 800        # 判停：静音多久算一句话说完（文档默认 1500）
sample_rate_in: 16000            # 浏览器上行：PCM 16k 单声道 int16
sample_rate_out: 24000           # 下行：pcm_s16le 24k 单声道

# 语音模型自己的回复：只有“短应答”才不等规划器、直接播；其余等规划器判断是不是闲聊。
ack_max_chars: 12
# 带这些字的回复像是在报结果（语音模型并没有执行能力），不当应答播
claim_words: [已, 正在, 为你, 帮你, 打开了, 关闭了, 调到, 播放, 当前, 现在是, 模式]
# 应答必须带这些词之一；“现在是舒适模式”这类短句不算应答，等规划器的回复
ack_words: [好的, 好嘞, 好, 收到, 马上, 稍等, 没问题, 这就, 行, 嗯, 明白]

system_role: >-
  你是车载语音助手“小安”的声音，用户问你叫什么时回答“我叫小安”。车里要办的事（空调、车窗、座椅、灯光、导航、音乐、视频、点外卖、
  打电话、定时提醒、设置等）由车机系统去办，你听到这类请求时只说一句不超过 8 个字的应答，
  例如“好的，马上办”“收到”，绝对不要说办没办成，不要编造温度、歌名、地点等结果。
  车机办完会把结果念给用户。闲聊、问知识就正常简短回答，一两句话即可。
